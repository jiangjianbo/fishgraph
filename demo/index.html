<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fishgraph · 纯网格布局</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; display: flex; height: 100vh; font-family: system-ui, 'PingFang SC', sans-serif;
      color: #0f172a; background: #f8fafc;
    }
    aside {
      width: 280px; padding: 14px; overflow-y: auto; border-right: 1px solid #e2e8f0; background: #ffffff;
    }
    h1 { font-size: 16px; margin: 4px 0 10px; }
    fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; padding: 8px 10px; }
    legend { font-size: 12px; color: #64748b; padding: 0 4px; }
    label.row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 6px 0; }
    label.row .name { width: 96px; color: #334155; }
    label.row input[type='range'] { flex: 1; }
    output { width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: #0f172a; }
    select, button {
      font-size: 12px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc;
    }
    button { cursor: pointer; margin-right: 6px; }
    button:hover { background: #e2e8f0; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #view { flex: 1; width: 100%; cursor: grab; touch-action: none; }
    #status { padding: 6px 12px; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; white-space: pre-line; }
  </style>
</head>
<body>
  <aside>
    <h1>fishgraph · 纯网格布局</h1>
    <fieldset>
      <legend>示例图</legend>
      <label class="row"><span class="name">图</span>
        <select id="graph" style="flex:1">
          <option value="tree">树（21 节点）</option>
          <option value="grid">网格 5×5</option>
          <option value="star">星形（1+12）</option>
          <option value="mixed">成群组+离散点</option>
          <option value="random">随机图（80 节点）</option>
          <option value="shapes">形状+边文字</option>
          <option value="flow">有向流程图</option>
          <option value="groups">分组（子图）</option>
          <option value="mermaidSub">架构图（4 层 subgraph）</option>
        </select>
      </label>
      <label class="row"><span class="name">流动方向</span>
        <select id="direction" style="flex:1">
          <option value="none" selected>无向（波纹放置）</option>
          <option value="TB">自顶向下 TB</option>
          <option value="LR">自左向右 LR</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>网格参数</legend>
      <label class="row"><span class="name">自然边长 L（格）</span><input id="L" type="range" min="2" max="16" step="1" value="6" /><output id="Lv"></output></label>
      <label class="row"><span class="name">走线通道宽（格）</span><input id="cm" type="range" min="0" max="4" step="1" value="1" /><output id="cmv"></output></label>
      <label class="row"><span class="name">边文字占位</span><input id="lc" type="checkbox" checked /></label>
    </fieldset>

    <fieldset>
      <legend>连线风格</legend>
      <label class="row"><span class="name">路径</span>
        <select id="pathStyle" style="flex:1">
          <option value="orthogonal" selected>正交折线</option>
          <option value="straight">直线</option>
          <option value="bezier">贝塞尔曲线</option>
          <option value="oblique">斜折线（分散）</option>
        </select>
      </label>
      <label class="row"><span class="name">端点对接</span>
        <select id="portStyle" style="flex:1">
          <option value="fixed" selected>固定四点</option>
          <option value="distributed">同侧均匀分布</option>
        </select>
      </label>
      <label class="row"><span class="name">转弯</span>
        <select id="cornerStyle" style="flex:1">
          <option value="sharp" selected>直角</option>
          <option value="round">圆角</option>
        </select>
      </label>
      <label class="row"><span class="name">圆角半径</span><input id="cr" type="range" min="0" max="16" step="1" value="8" /><output id="crv"></output></label>
      <label class="row"><span class="name">交叉</span>
        <select id="crossingStyle" style="flex:1">
          <option value="plain" selected>平交</option>
          <option value="bridge">立交（跳线）</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>视图</legend>
      <button id="restart">重新布局</button>
      <button id="fitView">适应视图</button>
    </fieldset>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div id="status"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
